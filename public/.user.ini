; =============================================================
; Konfigurasi PHP untuk shared hosting (cPanel)
;
; File .user.ini hanya dibaca oleh PHP-FPM/CGI di dalam folder public/.
; Nilai di sini menggantikan default host yang biasanya hanya 2M untuk
; upload — padahal aplikasi ini menerima import PDF dan Excel jauh lebih besar.
;
; Jangan menaikkan batas upload tanpa alasan: nilai yang terlalu besar
; membuka risiko denial-of-service lewat request body yang besar.
; =============================================================

; Batas upload. Import PDF bisa sampai 50 MB, jadi diberi sedikit ruang di atas
; angka tersebut agar pesan error aplikasi ("Maksimal 50 MB") muncul sebelum
; PHP menolaknya dengan pesan yang lebih membingungkan.
upload_max_filesize = 64M
post_max_size = 64M

; Import PDF + OCR (tesseract) + parsing Excel bisa berjalan lama.
max_execution_time = 300
max_input_time = 300

; Naikkan dari default 128M karena proses OCR/PDF butuh headroom.
memory_limit = 512M

; Buffer keluaran yang cukup agar export PDF/Excel tidak terpotong.
output_buffering = 4096

; Matikan display_errors di production agar detail error tidak pernah bocor ke
; layar. Ini lapisan kedua; lapisan pertama adalah APP_DEBUG=false.
display_errors = Off
